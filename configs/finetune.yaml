base: olmo_stage1          # the stage-1 checkpoint (spec §7): same documented-zero weights as the ladder's phase 1
adapter_prefix: olmo       # adapters land in adapters/<prefix>_<set>, matching the selfrun registry names
seed: 0
sizes: [500, 2000]        # plus "full" (all kept rows) and "format_only" (full, responses shuffled)
max_seq_len: 384
epochs: 2
batch_size: 4
grad_accum: 4
dtype: bfloat16      # bf16; if MPS runs out of memory on the 1B model use batch_size 2 / grad_accum 8 (same effective batch)
lr: 2.0e-4
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
