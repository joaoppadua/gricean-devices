    repo: allenai/OLMo-2-0425-1B
    revision: main
    family: olmo
    template: none
  olmo_sft:
    repo: allenai/OLMo-2-0425-1B-SFT
    revision: main
    family: olmo
    template: chat
  olmo_dpo:
    repo: allenai/OLMo-2-0425-1B-DPO
    revision: main
    family: olmo
    template: chat
  olmo_instruct:
    repo: allenai/OLMo-2-0425-1B-Instruct
    revision: main
    family: olmo
    template: chat
  qwen_base:
    repo: Qwen/Qwen2.5-1.5B
    revision: main
    family: qwen
    template: none
  qwen_instruct:
    repo: Qwen/Qwen2.5-1.5B-Instruct
