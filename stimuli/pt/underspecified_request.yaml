# Quota: 2 dissociation + 1 control. Ids: pt_ur_01..02, controls pt_ur_c01..c01.
# Dissociation: a request with a missing slot ("Translate 'obrigado'.").
# intended_continuation: the most plausible completion (here: into the prompt's language).
# literal_continuation: the clarifying question or refusal to choose ("Into which language?").
# Vary the missing slot: target language, unit, audience, format, date range.
# Controls: the same request with the slot filled. Not ablated.
# Written natively in Brazilian Portuguese; same contrast, not translations of the English items.
# Politeness markers available for stripping: por favor, obrigado, obrigada (edit ablation.yaml BEFORE the final freeze if more are needed).
category: underspecified_request
language: pt
items:
